<!doctype html><html><head><meta charset="utf-8"><style>reader-page{display:block;width:600px;height:800px;background:#eee;color:#111;font:48px sans-serif}</style></head><body tabindex="0">
<reader-page id="page-0-0">Local test page 1</reader-page>
<script>let index=0;document.addEventListener('keydown', event=>{if(event.key==='ArrowRight'){index++;const p=document.querySelector('reader-page');p.id=`page-${index}-0`;p.textContent=`Local test page ${index+1}`;}});</script>
</body></html>
