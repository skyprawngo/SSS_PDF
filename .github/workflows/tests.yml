name: Cross-platform checks
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python: ['3.11', '3.14']
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m unittest discover -s tests -v
      - run: python -m sss_pdf --help
      - run: python -m build
      - name: Verify wheel installation and packaged web assets
        run: python -c "import pathlib, subprocess, sys; wheel=next(pathlib.Path('dist').glob('*.whl')); subprocess.check_call([sys.executable, '-m', 'pip', 'install', '--force-reinstall', '--no-deps', str(wheel)])"
      - name: Verify installed package outside source tree
        working-directory: ${{ runner.temp }}
        run: python -c "from importlib.resources import files; p=files('sss_pdf').joinpath('static'); assert p.joinpath('index.html').is_file(); import sss_pdf.cli"
  browser-integration:
    name: Real Chrome UI workflow
    runs-on: ubuntu-latest
    env:
      SSS_PDF_BROWSER_TEST: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install --upgrade pip
      - run: python -m pip install -e ".[dev]"
      - name: Locate runner Chrome
        shell: bash
        run: |
          chrome_path="$(command -v google-chrome || command -v google-chrome-stable)"
          "$chrome_path" --version
          echo "SSS_PDF_CHROME_PATH=$chrome_path" >> "$GITHUB_ENV"
      - name: Test real UI, page capture and PDF generation
        run: python -m unittest discover -s tests -v
  package:
    name: Downloadable application
    needs: [test, browser-integration]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.12'
          cache: pip
      - run: python -m pip install -e ".[dev]"
      - run: python -m build
      - name: Package runnable source
        shell: python
        run: |
          from pathlib import Path
          from zipfile import ZIP_DEFLATED, ZipFile
          root_files = [
              "run.py", "start.command", "start.bat", "pyproject.toml",
              "requirements.txt", "readme.md", "LICENSE", ".gitignore",
              "mainpybychrome.py", "pngtopdf.py",
          ]
          roots = [Path(name) for name in ("sss_pdf", "tests", "docs", ".github")]
          candidates = [Path(name) for name in root_files]
          for root in roots:
              if root.is_dir():
                  candidates.extend(root.rglob("*"))
          with ZipFile("dist/sss-pdf-source.zip", "w", ZIP_DEFLATED) as archive:
              for path in sorted(candidates):
                  if not path.is_file() or path.is_symlink():
                      continue
                  if "__pycache__" in path.parts or path.suffix in {".pyc", ".pyo"}:
                      continue
                  archive.write(path, Path("SSS_PDF") / path)
      - uses: actions/upload-artifact@v7
        with:
          name: sss-pdf-application
          path: |
            dist/sss-pdf-source.zip
            dist/*.whl
            dist/*.tar.gz
          if-no-files-found: error
          retention-days: 14
